plugins {
    id 'com.gtnewhorizons.retrofuturagradle' version '2.+'
}

version = mod_version
group = mod_group

base {
    archivesName = mod_archive_name
}

repositories {
    maven {url 'https://jitpack.io'}
    maven {url "https://cursemaven.com"}
    maven {url 'https://maven.cleanroommc.com'}
    mavenCentral()
    mavenLocal()
}

configurations {
    include; implementation.extendsFrom(include)
}

dependencies {
    include('com.github.Artur114Projects.BananaLib:asm:1.0.5-betta') {transitive=false}
    include('com.github.Artur114Projects.BananaLib:util:1.0.5-betta') {transitive=false}
    include('com.github.Artur114Projects.BananaLib:math:1.0.5-betta') {transitive=false}


    implementation 'org.jetbrains:annotations:24.0.0'
    implementation rfg.deobf('curse.maven:thaumcraft-223628:2629023')
    implementation rfg.deobf('curse.maven:baubles-227083:2518667')
}

minecraft {
    useDependencyAccessTransformers = true
    mcVersion.set('1.12.2')
    mcpMappingChannel.set("stable")
    mcpMappingVersion.set("39")
}

for (runTask in ['runClient', 'runServer']) {
    tasks.named(runTask).configure {
        extraJvmArgs.add("-Dfml.coreMods.load=$mod_core_class")
    }
}

processResources {
    Map replaceProperties = [version: mod_version, mcversion: '1.12.2']
    List includeFiles = ["mcmod.info"]

    inputs.properties replaceProperties

    filesMatching(includeFiles) {
        it.expand(replaceProperties)
    }
}

jar {
    from {
        configurations.include.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    manifest {
        attributes(
            "ForceLoadAsMod": "true",
            "FMLCorePlugin": mod_core_class,
            "FMLCorePluginContainsFMLMod": "true",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        )
    }
}

apply from: file("scripts/rfg.gradle")